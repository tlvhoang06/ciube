spring:
  application:
    name: ciube
  datasource:
    url: jdbc:postgresql://localhost:5432/ciube_db
    username: postgres
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  signer-key: ${SECRET_KEY}
  access-token-duration: 3600
  refresh-token-duration: 604800
  issuer: ciube.com

logging:
  level:
    org.springframework.security: DEBUG